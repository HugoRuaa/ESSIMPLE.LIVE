name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_SUPABASE_SCHEMA: essimple
      VITE_APK_URL: ${{ vars.APK_URL }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la web y sincronizar con Android
        run: |
          npm run build
          npx cap sync android

      - name: Preparar llave de firma (opcional)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALIAS_OVERRIDE: ${{ vars.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/simple.keystore"
          # El alias se lee del propio keystore (salvo que definas la variable ANDROID_KEY_ALIAS).
          ALIAS="$ALIAS_OVERRIDE"
          if [ -z "$ALIAS" ]; then
            ALIAS=$(keytool -list -keystore "$RUNNER_TEMP/simple.keystore" -storepass "$STORE_PASSWORD" 2>/dev/null | grep -E "PrivateKeyEntry|keyEntry" | head -1 | cut -d, -f1)
          fi
          if [ -z "$ALIAS" ]; then
            echo "::error::No se encontró ninguna llave dentro del keystore. Revisa ANDROID_KEYSTORE_BASE64 y ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi
          echo "Alias detectado: $ALIAS"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/simple.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}" >> "$GITHUB_ENV"

      - name: Compilar el APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x ./gradlew && ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle.log"

      - name: Resumen del error de compilación (solo si falló)
        if: failure()
        run: |
          msg=$(grep -nE "error:|e: |FAILURE|What went wrong|Caused by|Execution failed|cannot find symbol|not found|licen" -A2 gradle.log | head -50 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle::${msg}"

      - name: Renombrar el APK
        run: cp android/app/build/outputs/apk/release/app-release.apk essimple.apk

      - name: Publicar en GitHub Releases (enlace estable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "essimple.live (APK)" --notes "Última versión del APK de essimple.live" --latest=false
          gh release upload apk essimple.apk --clobber

      - name: Publicar en Supabase Storage (opcional, enlace público sin necesidad de repo público)
        if: ${{ env.SUPABASE_SERVICE_KEY != '' }}
        run: |
          curl -sS -f -X POST "$SUPABASE_URL/storage/v1/object/apk/essimple.apk" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "x-upsert: true" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @essimple.apk
          echo "APK público: $SUPABASE_URL/storage/v1/object/public/apk/essimple.apk"
