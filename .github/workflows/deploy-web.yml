name: Publicar sitio en Hostinger

# Cada cambio en main construye el sitio y lo sube por FTP a Hostinger.
# Requiere los secretos FTP_SERVER, FTP_USERNAME y FTP_PASSWORD (y opcionalmente la variable FTP_DIR, por defecto public_html/).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'android/**'
      - 'ANDROID.md'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_SUPABASE_SCHEMA: essimple
      VITE_APK_URL: ${{ vars.APK_URL }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx vite build

      - name: Subir a Hostinger por FTP
        if: ${{ env.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: ${{ vars.FTP_DIR || 'public_html/' }}

      - name: Aviso si falta la configuración de FTP
        if: ${{ env.FTP_SERVER == '' }}
        run: |
          echo "::warning::Faltan los secretos FTP_SERVER, FTP_USERNAME y FTP_PASSWORD, así que el sitio se construyó pero no se subió a Hostinger."
